[workspace]
name = "sarax"
version = "0.1.0"
description = "SARAX+ — 2-DoF manipulator on a PX4 coaxial octocopter (ROS 2 Humble + Gazebo Harmonic)"
# robostack-humble provides pre-built ROS 2 Humble conda packages.
# conda-forge provides Gazebo Harmonic, build tools, and Python deps.
channels = ["robostack-humble", "conda-forge"]
platforms = ["linux-64"]

[activation.env]
# Tell ros_gz (and gz_ros2_control) to build/link against Gazebo Harmonic (gz-sim8).
# ros_gz_sim CMakeLists reads $ENV{GZ_VERSION}, not a CMake -D variable.
GZ_VERSION = "harmonic"
# Expose the workspace-built gz_ros2_control plugin to Gazebo's plugin loader.
# pluginlib resolves packages via the ament index; the workspace overlay handles
# that — but Gazebo's own loader also needs the .so on this path.
GZ_SIM_SYSTEM_PLUGIN_PATH = "$PIXI_PROJECT_ROOT/install/gz_ros2_control/lib:$GZ_SIM_SYSTEM_PLUGIN_PATH"
# Let Gazebo resolve model:// URIs for sarax meshes (base, links, rotors).
# GZ_SIM_RESOURCE_PATH = "$PIXI_PROJECT_ROOT/install/sarax_description/share:$GZ_SIM_RESOURCE_PATH"
# Gazebo subprocesses (ros_gz_sim/create) need librclcpp.so and friends on LD_LIBRARY_PATH.
# LD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/.pixi/envs/default/lib:$LD_LIBRARY_PATH"
# ── ROS 2 Humble ─────────────────────────────────────────────────────────────
[dependencies]
ros-humble-desktop = "*"

# ros2_control stack
ros-humble-ros2-control = "*"
ros-humble-ros2-controllers = "*"
ros-humble-controller-manager = "*"
ros-humble-joint-state-broadcaster = "*"
ros-humble-forward-command-controller = "*"

# ros_gz_bridge runtime dependency
ros-humble-actuator-msgs = "*"
ros-humble-vision-msgs = "*"

# Robot description
ros-humble-robot-state-publisher = "*"
ros-humble-xacro = "*"

# Dynamics (used by PDGravityLaw inside sarax_impedance_controller)
ros-humble-pinocchio = "*"
ros-humble-realtime-tools = "*"

# ── Gazebo Harmonic dev headers (needed to build gz_ros2_control from source) ─
gz-sim8 = "*"
gz-plugin2 = "*"

# ── Build tools ───────────────────────────────────────────────────────────────
colcon-common-extensions = "*"
vcstool = "*"
cmake = ">=3.16"
python = ">=3.10"
pip = "*"
ninja = "*"

# ── PX4 Python build dependencies ────────────────────────────────────────────
# PX4 requires empy 3.x — 4.x changed the API and breaks the Jinja templates.
empy = "3.3.4.*"
jinja2 = "*"
numpy = "*"
packaging = "*"
future = "*"
pyulog = "*"
jsonschema = "*"
pinocchio = ">=3.9.0,<4"
ros-humble-joint-state-publisher-gui = ">=2.4.0,<3"

# ── PyPI-only packages (not available in conda channels) ─────────────────────
[pypi-dependencies]
pyros-genmsg = "*"
kconfiglib = "*"

[tasks]
# ── First-time setup ─────────────────────────────────────────────────────────
install = { cmd = "bash scripts/install.sh", description = "Clone deps and build everything" }

# ── Incremental rebuild ──────────────────────────────────────────────────────
build = { cmd = "bash scripts/build.sh", description = "Rebuild the ROS 2 workspace" }

# ── Simulation (two terminals) ───────────────────────────────────────────────
# Terminal 1 →  pixi run px4
# Terminal 2 →  pixi run ros   (after "Gazebo world is ready")
px4 = { cmd = "bash scripts/px4.sh", description = "Launch PX4 SITL + Gazebo Harmonic" }
ros = { cmd = "bash scripts/ros.sh", description = "Launch robot_state_publisher + controllers" }
motor_hardware = { cmd = "bash scripts/motor_hardware.sh", description = "Configure CAN and launch the real AK60 motors; activation stays manual" }
camera_hardware = { cmd = "bash scripts/camera_hardware.sh", description = "Start the real depth camera and point-cloud filter" }

# Normal estimation; append launch arguments such as search_radius:=0.1.
mls = { cmd = "bash -c 'set -e; source install/setup.bash; export LD_LIBRARY_PATH=\"${CONDA_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}\"; export RMW_IMPLEMENTATION=\"${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}\"; exec ros2 launch sarax_perception mls_normal_launch.py \"$@\"' --", description = "MLS normal estimation from the filtered point cloud" }
pca = { cmd = "bash -c 'set -e; source install/setup.bash; export LD_LIBRARY_PATH=\"${CONDA_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}\"; export RMW_IMPLEMENTATION=\"${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}\"; exec ros2 launch sarax_perception pca_normal_launch.py \"$@\"' --", description = "PCA normal estimation from the filtered point cloud" }
perception_frames = { cmd = "bash -c 'set -e; source install/setup.bash; export LD_LIBRARY_PATH=\"${CONDA_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}\"; export RMW_IMPLEMENTATION=\"${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}\"; exec ros2 launch sarax_description perception_frames.launch.py \"$@\"' --", description = "Publish robot frames and a temporary world equal to the base; no motors" }
select_v1 = { cmd = "bash -c 'set -e; source install/setup.bash; export LD_LIBRARY_PATH=\"${CONDA_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}\"; export RMW_IMPLEMENTATION=\"${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}\"; exec ros2 run sarax_perception normal_selector_v1.py --ros-args -p input_topic:=/pca_normals \"$@\"' --", description = "Select a PCA normal with the v1 UI and save TF coordinates" }
select_mls_v1 = { cmd = "bash -c 'set -e; source install/setup.bash; export LD_LIBRARY_PATH=\"${CONDA_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}\"; export RMW_IMPLEMENTATION=\"${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}\"; exec ros2 run sarax_perception normal_selector_v1.py --ros-args -p input_topic:=/mls_normals \"$@\"' --", description = "Select an MLS normal with the v1 UI and save TF coordinates" }

# Keep the camera SDK's Python 3.11 dependencies separate from the control stack.
[feature.camera.dependencies]
python = "3.11.*"
ros-humble-realsense2-camera = "==4.55.1"
ros-humble-ros-base = "*"
ros-humble-rmw-cyclonedds-cpp = "*"

# PlotJuggler lives in its own environment: it pulls conda binutils and a glibc 2.28
# sysroot, and with those in the default environment the system compiler links against
# the wrong libpthread (undefined GLIBC_PRIVATE symbols in ros_gz_sim). Run: pixi run plot
[feature.plot.dependencies]
ros-humble-ros-base = "*"
ros-humble-plotjuggler = ">=3.15.0,<4"
ros-humble-plotjuggler-ros = ">=2.3.1,<3"

[feature.plot.tasks]
plot = { cmd = "ros2 run plotjuggler plotjuggler", description = "PlotJuggler with the ROS 2 plugins (separate environment)" }

[environments]
camera = { features = ["camera"], no-default-feature = true }
plot = { features = ["plot"], no-default-feature = true }
