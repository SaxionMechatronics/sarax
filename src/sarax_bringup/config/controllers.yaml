controller_manager:
  ros__parameters:
    update_rate: 250 # Hz -- matches Gazebo simulation period (0.004 s)

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # A trivial effort-passthrough, useful for bring-up and bridge sanity checks.
    forward_effort_controller:
      type: forward_command_controller/ForwardCommandController

    # The main deliverable.
    joint_impedance_controller:
      type: sarax_impedance_controller/JointImpedanceController

# ---------------------------------------------------------------------------

forward_effort_controller:
  ros__parameters:
    joints:
      - mani_joint_1
      - mani_joint_2
    interface_name: effort

joint_impedance_controller:
  ros__parameters:
    joints:
      - mani_joint_1
      - mani_joint_2
    stiffness_0: 10.0 # N.m / rad — mani_joint_1
    stiffness_1: 10.0 # N.m / rad — mani_joint_2
    damping_0: 0.64   # N.m.s / rad — mani_joint_1 
    damping_1: 0.37   # N.m.s / rad — mani_joint_2
    # No torque limit here: the controller clamps to the joint <limit effort> of the URDF.
    max_position_error: 0.5 # rad, clamp before Kp is applied
    reference_timeout: 0.5 # s; a ~/reference that stops refreshing is dropped and the arm holds its pose (0 = off)

    # Fold/extend (~/move_to_pose): named poses [mani_joint_1, mani_joint_2] in rad, ramped to at
    # ramp_velocity_scale x the URDF joint velocity limit. SITL values, equal to arm_poses in
    # profiles/sitl.yaml (a test checks it); the vehicle gets arm_poses of profiles/hw.yaml from
    # ak60_hardware.launch.py. PROVISIONAL, not the ROS 1 poses: ROS 1 fold 75/80 and extend -60/90 deg are in its
    # controller coordinates (q3c = q2 - q1) and still need converting (parked, parameters_todo.md).
    pose_stowed: [1.309, 1.3963]
    pose_extended: [-1.0472, 1.5708]
    ramp_velocity_scale: 0.5

    # SITL gravity model: constants consistent with sarax_plus.urdf.xacro (link3 = L2 0.4 m,
    # m2/d2 from link3; m3/d3 = link4 + ee_link lumped). The gz_ros2_control plugin loads this
    # file directly. The real vehicle uses the hw profile's controller.gravity (ROS 1 hardware
    # constants, until system identification), applied by ak60_hardware.launch.py.
    gravity_g: 9.81        # m/s^2
    gravity_L2: 0.4        # m, first moving link length
    gravity_m2: 0.363477   # kg, first moving link mass
    gravity_d2: 0.2587     # m, its center-of-mass distance from the pivot
    gravity_m3: 0.123791   # kg, second moving link (link4 + ee_link)
    gravity_d3: 0.21612    # m, its center-of-mass distance from the pivot

    # Switch laws by changing this string. Shipped laws:
    #   sarax_impedance_controller::PDLaw        (no dynamics)
    #   sarax_impedance_controller::PDGravityLaw (analytic gravity model, default)
    #   sarax_impedance_controller::PDPinocchioGravityLaw (Pinocchio RNEA on robot_description;
    #                                             ignores the gravity_* constants above)
    # Third-party packages can add more via pluginlib.
    impedance_law: sarax_impedance_controller::PDGravityLaw
