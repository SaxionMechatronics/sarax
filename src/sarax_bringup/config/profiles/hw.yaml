# Platform values for the real vehicle (SARAX_TARGET=hw).
target: hw

use_sim_time: false

# SocketCAN adapter of the AK60 motors. Empty: scripts/motor_hardware.sh picks the single
# CAN adapter found; the launch file then needs can_interface:= explicitly.
can_interface: ""
can_bitrate: 1000000

# Manipulator joints (index = joint number). The torque limit (5 N*m) is not set here: its
# only source is the URDF joint <limit effort> (sarax_description).
motors:
  motor_1: {id: 2, stiffness: 9.0, damping: 1.0}
  motor_2: {id: 3, stiffness: 5.0, damping: 1.0}

# Belt between motor 2 and the second link (URDF <transmission>, applied by sarax_arm_system).
# ratio: motor turns per joint turn (> 0); sign: +1 or -1 for the direction flip. 1:1 until the
# bench measures them.
belt: {ratio: 1.0, sign: 1}

# Arm poses [mani_joint_1, mani_joint_2] [rad] of ~/move_to_pose, applied by ak60_hardware.launch.py.
# From ROS 1 (controller_user_control.cpp on sarax@main: fold 75/80 deg, extend -60/90 deg), converted from its
# controller coordinates (q3c = q2 - q1) to joint angles: stowed 75/155 deg, extended -60/30 deg. The conversion
# is confirmed, the absolute values are not bench-verified: check the stowed pose against the real joint-2 range
# (URDF upper limit 2.8 rad = 160 deg) before the first run on the vehicle.
arm_poses:
  stowed: [1.309, 2.7053]    # 75, 155 deg
  extended: [-1.0472, 0.5236]  # -60, 30 deg

controller:
  impedance_law: sarax_impedance_controller::PDGravityLaw
  max_position_error: 1.0
  reference_timeout: 0.5
  # Original ROS 1 hardware gravity constants; replace after system identification on the bench.
  gravity: {g: 9.81, L2: 0.46, m2: 0.72, d2: 0.23, m3: 0.3, d3: 0.25}

driver:
  use_second_motor: true
  feedback_timeout: 0.1
  startup_timeout: 1.0

# Hardware-only PX4 parameters belong here (none yet; SITL-only ones live in sitl.yaml).
px4_params: {}
