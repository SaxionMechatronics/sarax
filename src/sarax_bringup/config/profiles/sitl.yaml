# Platform values for the simulated vehicle (SARAX_TARGET=sitl, the default).
target: sitl

# SITL runs the ROS side on the Gazebo clock (/clock bridged).
use_sim_time: true

# SITL-only PX4 parameters, applied by scripts/px4.sh as PX4_PARAM_<NAME>
# (an exported environment variable still wins). Never set these on the vehicle.
px4_params:
  # No data-link-loss action, so arming does not require a ground station.
  NAV_DLL_ACT: 0

# Arm poses [mani_joint_1, mani_joint_2] [rad] of ~/move_to_pose. The ROS 1 fold (75/80 deg) and extend (-60/90 deg) of controller_user_control.cpp converted from
# its controller coordinates (q3c = q2 - q1) to joint angles, q2 = q3c + q1: stowed 75/155, extended -60/30 deg.
# The conversion is confirmed by the supervisor, the absolute values still need the bench (README, Arm kinematics).
# The simulator loads config/controllers.yaml directly, which must hold the same values.
arm_poses:
  stowed: [1.309, 2.7053]    # 75, 155 deg
  extended: [-1.0472, 0.5236]  # -60, 30 deg

# Frame names of the Gazebo model.
frames:
  gz_base_link: sarax_plus_0/base_link
  gz_camera: sarax_plus_0/camera_link/rgbd_camera
  base_link: base_link

# Fixed transform base -> camera of the Gazebo model, [x, y, z, qx, qy, qz, qw]. Must match
# the camera pose in the URDF and models/sarax_plus/model.sdf (rear camera).
camera_tf: [-0.15, 0.0, 0.05, 0.0, 0.0, 1.0, 0.0]

# manipulator_only.launch.py
manipulator_only:
  model_name: sarax_plus
  spawn_z: 0.3
